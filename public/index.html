<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapToPoster - 地图海报生成器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      height: calc(100vh - 40px);
    }

    /* 主布局：预览 + Tabs */
    .main-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      height: 100%;
    }

    @media (max-width: 900px) {
      .main-layout {
        grid-template-columns: 1fr;
        height: auto;
      }
    }

    .panel {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* 预览区域 */
    .preview-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(45deg, #444 25%, transparent 25%),
        linear-gradient(-45deg, #444 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #444 75%),
        linear-gradient(-45deg, transparent 75%, #444 75%),
        #333;
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      border: 1px solid #444;
      transition: background 0.3s ease;
    }

    .preview-area.light {
      background:
        linear-gradient(45deg, #ccc 25%, transparent 25%),
        linear-gradient(-45deg, #ccc 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ccc 75%),
        linear-gradient(-45deg, transparent 75%, #ccc 75%),
        #e8e8e8;
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      border: 1px solid #ddd;
    }

    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }

    .preview-container:active {
      cursor: grabbing;
    }

    .preview-wrapper {
      position: relative;
      transform-origin: center center;
      transition: transform 0.1s ease-out;
    }

    .preview-wrapper.dragging {
      transition: none;
    }

    .preview-placeholder {
      text-align: center;
      color: #999;
    }

    .preview-placeholder svg {
      width: 80px;
      height: 80px;
      margin-bottom: 16px;
      opacity: 0.5;
      stroke: #999;
    }

    .preview-image {
      max-width: 100%;
      max-height: calc(100vh - 80px);
      margin: 20px 0 80px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: block;
    }

    .preview-controls {
      position: absolute;
      bottom: 12px;
      left: 12px;
      display: flex;
      gap: 4px;
      background: rgba(0,0,0,0.7);
      padding: 4px 12px;
      border-radius: 20px;
      z-index: 10;
      height: 40px;
      align-items: center;
    }

    .preview-controls button {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: white;
      font-size: 18px;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .preview-controls button:hover {
      background: rgba(255,255,255,0.2);
    }

    .zoom-level {
      color: white;
      font-size: 12px;
      min-width: 50px;
      text-align: center;
      line-height: 36px;
    }

    /* Tabs 面板 */
    .tabs-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .tabs-header {
      display: flex;
      border-bottom: 1px solid #ecf0f1;
      background: #f8f9fa;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 16px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      color: #7f8c8d;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .tab-btn:hover {
      color: #2c3e50;
      background: rgba(52, 152, 219, 0.05);
    }

    .tab-btn.active {
      color: #3498db;
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #3498db;
    }

    .tabs-content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .tab-panel {
      display: none;
      height: 100%;
      overflow-y: auto;
    }

    .tab-panel.active {
      display: block;
    }

    /* 编辑面板 */
    .edit-panel {
      padding: 20px;
    }

    .config-group {
      padding: 16px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .config-group h4 {
      font-size: 13px;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 16px;
      padding-left: 8px;
      border-left: 3px solid #3498db;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 500;
      color: #555;
    }

    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group input[type="color"],
    .form-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #3498db;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-hint {
      font-size: 11px;
      color: #7f8c8d;
      margin-top: 3px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #3498db;
    }

    .checkbox-group label {
      margin-bottom: 0;
      cursor: pointer;
    }

    .color-preview {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid #ddd;
      vertical-align: middle;
      margin-left: 6px;
    }

    .action-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #ecf0f1;
    }

    .btn {
      padding: 12px 32px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #3498db;
      color: white;
    }

    .btn-primary:hover {
      background: #2980b9;
    }

    .btn-primary:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
    }

    .btn-generate-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: #bdc3c7;
      border-radius: 8px;
      cursor: not-allowed;
    }

    .btn-generate-wrapper .btn-text {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: #7f8c8d;
    }

    .btn-generate-wrapper .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #95a5a6;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .stop-btn {
      width: 24px;
      height: 24px;
      background: #e74c3c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .stop-btn:hover {
      background: #c0392b;
    }

    .stop-btn::before {
      content: '';
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 1px;
    }

    .btn-secondary {
      background: #ecf0f1;
      color: #2c3e50;
    }

    .btn-secondary:hover {
      background: #d5dbdb;
    }

    .btn-map {
      width: 100%;
      margin-top: 8px;
      padding: 10px 16px;
      background: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-map:hover {
      background: #e9ecef;
      border-color: #3498db;
    }

    /* 坐标历史记录 */
    .location-history {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #ecf0f1;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .history-header label {
      font-size: 13px;
      font-weight: 500;
      color: #555;
      margin: 0;
    }

    .btn-save-location {
      padding: 4px 12px;
      font-size: 12px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-save-location:hover {
      background: #2980b9;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .history-item:hover {
      border-color: #3498db;
      background: #f8f9fa;
    }

    .history-item-coords {
      flex: 1;
      font-size: 12px;
      color: #666;
      font-family: 'Monaco', 'Menlo', monospace;
    }

    .history-item-name {
      flex: 1;
      font-size: 13px;
      color: #333;
      border: none;
      background: transparent;
      outline: none;
      padding: 2px 4px;
    }

    .history-item-name:focus {
      background: #e3f2fd;
      border-radius: 3px;
    }

    .history-item-name::placeholder {
      color: #999;
      font-style: italic;
    }

    .history-item-delete {
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      color: #999;
      font-size: 16px;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 0.2s;
    }

    .history-item:hover .history-item-delete {
      opacity: 1;
    }

    .history-item-delete:hover {
      background: #e74c3c;
      color: white;
    }

    .history-empty {
      font-size: 12px;
      color: #999;
      padding: 12px;
      text-align: center;
    }

    /* 历史面板 */
    .history-panel {
      padding: 16px;
      background:
        linear-gradient(45deg, #444 25%, transparent 25%),
        linear-gradient(-45deg, #444 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #444 75%),
        linear-gradient(-45deg, transparent 75%, #444 75%),
        #333;
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .gallery-item {
      width: calc(50% - 4px);
      height: 0;
      padding-bottom: calc(50% - 4px);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid #555;
      box-sizing: border-box;
    }

    .gallery-item:hover,
    .gallery-item.active {
      border-color: #3498db;
    }

    .gallery-item img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-delete {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 50%;
      background: rgba(231, 76, 60, 0.9);
      color: white;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gallery-item:hover .gallery-delete {
      opacity: 1;
    }

    .gallery-delete:hover {
      background: rgba(192, 57, 43, 1);
    }

    .gallery-load-more {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      background: #f8f9fa;
      border: 2px dashed #ddd;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      color: #666;
      font-size: 13px;
      text-align: center;
      padding: 10px;
    }

    .gallery-load-more:hover {
      background: #e9ecef;
      border-color: #3498db;
      color: #3498db;
    }

    .empty-history {
      text-align: center;
      color: #999;
      padding: 40px 20px;
    }

    .empty-history svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
      stroke: #999;
    }

    /* 预设按钮 */
    .preset-locations {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .preset-btn {
      padding: 4px 10px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 12px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .preset-btn:hover {
      background: #3498db;
      color: white;
      border-color: #3498db;
    }

    /* 消息和日志 */
    .message {
      padding: 10px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 13px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    .log-output {
      background: #2c3e50;
      color: #ecf0f1;
      padding: 12px;
      border-radius: 6px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 11px;
      line-height: 1.5;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: 16px;
      display: none;
    }

    .log-output .log-line {
      padding: 2px 0;
      opacity: 0.7;
      transition: opacity 0.3s;
    }

    .log-output .log-line:last-child {
      opacity: 1;
      color: #fff;
      font-weight: 500;
    }

    .log-output .log-line.success {
      color: #2ecc71;
    }

    .log-output .log-line.error {
      color: #e74c3c;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid #ecf0f1;
      border-top-color: #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Modal 样式 */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
    }

    .modal-content {
      position: relative;
      background: white;
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #ecf0f1;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .modal-close {
      border: none;
      background: none;
      font-size: 24px;
      cursor: pointer;
      color: #7f8c8d;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .modal-close:hover {
      background: #ecf0f1;
    }

    .modal-body {
      padding: 20px;
    }

    .map-info {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 13px;
      color: #7f8c8d;
    }

    #selectedCoords {
      color: #3498db;
      font-weight: 500;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 16px 20px;
      border-top: 1px solid #ecf0f1;
      background: #f8f9fa;
    }

    .modal-footer .btn {
      padding: 8px 20px;
      font-size: 14px;
    }

    /* Leaflet 地图自定义样式 */
    .leaflet-container {
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-layout">
      <!-- 左侧：预览区域 -->
      <div class="panel">
        <div class="preview-area" id="previewArea">
          <div class="preview-container" id="previewContainer">
            <div class="preview-wrapper" id="previewWrapper">
              <div class="preview-placeholder" id="previewPlaceholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
                <p>点击"生成地图"开始创建</p>
              </div>
            </div>
          </div>
          <div class="preview-controls" id="previewControls" style="display: none;">
            <button onclick="zoomOut()" title="缩小">−</button>
            <span class="zoom-level" id="zoomLevel">100%</span>
            <button onclick="zoomIn()" title="放大">+</button>
            <button onclick="resetZoom()" title="重置">⌂</button>
            <button onclick="togglePreviewTheme()" title="切换背景">◐</button>
          </div>
        </div>
      </div>

      <!-- 右侧：Tabs 面板 -->
      <div class="panel tabs-panel">
        <div class="tabs-header">
          <button class="tab-btn active" data-tab="edit" onclick="switchTab('edit')">编辑配置</button>
          <button class="tab-btn" data-tab="history" onclick="switchTab('history')">历史记录</button>
        </div>

        <div class="tabs-content">
          <!-- 编辑配置面板 -->
          <div class="tab-panel edit-panel active" id="editTab">
            <div class="message" id="messageBox"></div>

            <!-- 位置信息 -->
            <div class="config-group">
              <h4>位置信息</h4>
              <div class="preset-locations">
                <button class="preset-btn" onclick="setPreset('beijing')">北京</button>
                <button class="preset-btn" onclick="setPreset('shanghai')">上海</button>
                <button class="preset-btn" onclick="setPreset('guangzhou')">广州</button>
                <button class="preset-btn" onclick="setPreset('shenzhen')">深圳</button>
                <button class="preset-btn" onclick="setPreset('hangzhou')">杭州</button>
                <button class="preset-btn" onclick="setPreset('chengdu')">成都</button>
              </div>
              <div class="form-group">
                <label>位置名称</label>
                <input type="text" id="locationName" placeholder="例如：我的家">
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>经度</label>
                  <input type="number" id="lon" step="0.000001" placeholder="116.407378">
                </div>
                <div class="form-group">
                  <label>纬度</label>
                  <input type="number" id="lat" step="0.000001" placeholder="40.047033">
                </div>
              </div>
              <div class="form-group">
                <button type="button" class="btn btn-map" onclick="openMapModal()">
                  📍 在地图上选择位置
                </button>
              </div>

              <!-- 坐标历史记录 -->
              <div class="location-history" id="locationHistory">
                <div class="history-header">
                  <label>最近使用</label>
                  <button type="button" class="btn-save-location" onclick="saveCurrentLocation()">保存当前位置</button>
                </div>
                <div class="history-list" id="historyList">
                  <!-- 动态填充 -->
                </div>
              </div>
            </div>

            <!-- 地图参数 -->
            <div class="config-group">
              <h4>地图参数</h4>
              <div class="form-group">
                <label>缩放级别 (1-20)</label>
                <input type="number" id="zoom" min="1" max="20" step="0.5" value="17">
                <div class="form-hint">建议：16-18 适合街道视图</div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>宽度 (px)</label>
                  <input type="number" id="width" value="1600" step="100">
                </div>
                <div class="form-group">
                  <label>高度 (px)</label>
                  <input type="number" id="height" value="1600" step="100">
                </div>
              </div>
              <div class="form-group">
                <label>边界形状</label>
                <select id="boundaryShape">
                  <option value="bbox" selected>矩形 (bbox)</option>
                  <option value="around">圆形 (around)</option>
                </select>
              </div>
              <div class="form-group">
                <label>输出文件名</label>
                <input type="text" id="filename" value="street-map.png">
              </div>
            </div>

            <!-- 主题设置 -->
            <div class="config-group">
              <h4>主题设置</h4>
              <div class="form-group">
                <label>主题色 <span class="color-preview" id="colorPreview"></span></label>
                <input type="color" id="themeColor" value="#ffffff">
                <div class="form-hint">所有元素（道路、水域、绿地、建筑物等）的基础颜色</div>
              </div>
            </div>

            <!-- 边框设置 -->
            <div class="config-group">
              <h4>边框设置</h4>
              <div class="form-group">
                <label>边框类型</label>
                <select id="borderType">
                  <option value="none">无边框</option>
                  <option value="single" selected>单边框</option>
                  <option value="double">双层边框</option>
                </select>
              </div>
              <div class="form-row" id="borderWidthRow">
                <div class="form-group">
                  <label>边框宽度 (px)</label>
                  <input type="number" id="borderWidth" value="4" min="1" max="20">
                </div>
              </div>
              <div class="form-row" id="doubleBorderRow" style="display: none;">
                <div class="form-group">
                  <label>外层宽度 (px)</label>
                  <input type="number" id="outerWidth" value="4" min="1" max="20">
                </div>
                <div class="form-group">
                  <label>间距 (px)</label>
                  <input type="number" id="borderGap" value="20" min="1" max="50">
                </div>
                <div class="form-group">
                  <label>内层宽度 (px)</label>
                  <input type="number" id="innerWidth" value="1" min="1" max="10">
                </div>
              </div>
            </div>

            <!-- 河流设置 -->
            <div class="config-group">
              <h4>河流设置</h4>
              <div class="checkbox-group">
                <input type="checkbox" id="showWater" checked>
                <label for="showWater">显示河流/水域</label>
              </div>
              <div class="form-group">
                <label>河流透明度 (%)</label>
                <input type="number" id="waterOpacity" value="40" min="0" max="100">
                <div class="form-hint">0=完全透明，100=不透明</div>
              </div>
            </div>

            <!-- 绿地设置 -->
            <div class="config-group">
              <h4>绿地设置</h4>
              <div class="checkbox-group">
                <input type="checkbox" id="showGreen" checked>
                <label for="showGreen">显示绿地/公园</label>
              </div>
              <div class="form-group">
                <label>绿地透明度 (%)</label>
                <input type="number" id="greenOpacity" value="80" min="0" max="100">
                <div class="form-hint">0=完全透明，100=不透明</div>
              </div>
            </div>

            <!-- 建筑物设置 -->
            <div class="config-group">
              <h4>建筑物设置</h4>
              <div class="checkbox-group">
                <input type="checkbox" id="showBuilding" checked>
                <label for="showBuilding">显示建筑物</label>
              </div>
              <div class="form-group">
                <label>建筑物透明度 (%)</label>
                <input type="number" id="buildingOpacity" value="60" min="0" max="100">
                <div class="form-hint">0=完全透明，100=不透明</div>
              </div>
              <div class="form-group">
                <label>绘制范围 (%)</label>
                <input type="number" id="buildingRange" value="80" min="0" max="100">
                <div class="form-hint">从图片中心开始的绘制范围，0-100%</div>
              </div>
            </div>

            <!-- 边缘过渡 -->
            <div class="config-group">
              <h4>边缘过渡</h4>
              <div class="form-group">
                <label>过渡类型</label>
                <select id="fadeType">
                  <option value="none">无</option>
                  <option value="gradient" selected>渐隐</option>
                </select>
              </div>
              <div class="form-group" id="fadeRatioRow">
                <label>过渡比例 (%)</label>
                <input type="number" id="fadeRatio" value="15" min="1" max="50">
                <div class="form-hint">边缘过渡宽度占图片尺寸的百分比</div>
              </div>
            </div>

            <div class="log-output" id="logOutput"></div>

            <div class="action-bar">
              <button class="btn btn-secondary" onclick="resetConfig()">重置</button>
              <button class="btn btn-primary" id="generateBtn" onclick="generateMap()">生成地图</button>
            </div>
          </div>

          <!-- 历史记录面板 -->
          <div class="tab-panel history-panel" id="historyTab">
            <div class="gallery" id="gallery">
              <div class="empty-history">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
                <p>暂无历史记录</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 地图 Modal -->
  <div id="mapModal" class="modal" style="display: none;">
    <div class="modal-overlay" onclick="closeMapModal()"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>选择位置</h3>
        <button class="modal-close" onclick="closeMapModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="mapContainer" style="width: 100%; height: 400px;"></div>
        <div class="map-info">
          <span>点击地图选择位置</span>
          <span id="selectedCoords"></span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeMapModal()">取消</button>
        <button class="btn btn-primary" onclick="confirmMapSelection()">确定</button>
      </div>
    </div>
  </div>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="js/config.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/mapGenerator.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapToPoster - 地图海报生成器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* 顶部预览和历史区域 - 并排 */
    .top-section {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 900px) {
      .top-section {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .panel h3 {
      font-size: 14px;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ecf0f1;
    }

    .preview-area {
      min-height: 500px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(45deg, #444 25%, transparent 25%),
        linear-gradient(-45deg, #444 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #444 75%),
        linear-gradient(-45deg, transparent 75%, #444 75%),
        #333;
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      border: 1px solid #444;
      transition: background 0.3s ease;
    }

    .preview-area.light {
      background:
        linear-gradient(45deg, #ccc 25%, transparent 25%),
        linear-gradient(-45deg, #ccc 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ccc 75%),
        linear-gradient(-45deg, transparent 75%, #ccc 75%),
        #e8e8e8;
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      border: 1px solid #ddd;
    }

    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }

    .preview-container:active {
      cursor: grabbing;
    }

    .preview-wrapper {
      position: relative;
      transform-origin: center center;
      transition: transform 0.1s ease-out;
    }

    .preview-wrapper.dragging {
      transition: none;
    }

    .preview-placeholder {
      text-align: center;
      color: #999;
    }

    .preview-placeholder svg {
      width: 80px;
      height: 80px;
      margin-bottom: 16px;
      opacity: 0.5;
      stroke: #999;
    }

    .preview-image {
      max-width: 100%;
      max-height: 480px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: block;
    }

    .preview-controls {
      position: absolute;
      bottom: 16px;
      left: 16px;
      display: flex;
      gap: 8px;
      background: rgba(0,0,0,0.7);
      padding: 8px 16px;
      border-radius: 24px;
      z-index: 10;
    }

    .preview-controls button {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: white;
      font-size: 18px;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .preview-controls button:hover {
      background: rgba(255,255,255,0.2);
    }

    .zoom-level {
      color: white;
      font-size: 12px;
      min-width: 50px;
      text-align: center;
      line-height: 36px;
    }

    /* 历史记录 */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 460px;
      overflow-y: auto;
      padding: 8px;
      background:
        linear-gradient(45deg, #444 25%, transparent 25%),
        linear-gradient(-45deg, #444 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #444 75%),
        linear-gradient(-45deg, transparent 75%, #444 75%),
        #333;
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }

    .gallery-item {
      width: calc(50% - 4px);
      height: 0;
      padding-bottom: calc(50% - 4px);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid #555;
      box-sizing: border-box;
    }

    .gallery-item:hover {
      border-color: #3498db;
    }

    .gallery-item img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-delete {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 50%;
      background: rgba(231, 76, 60, 0.9);
      color: white;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gallery-item:hover .gallery-delete {
      opacity: 1;
    }

    .gallery-delete:hover {
      background: rgba(192, 57, 43, 1);
    }

    /* 底部配置区域 */
    .config-section {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    .config-group {
      padding: 16px;
      background: #f8f9fa;
      border-radius: 8px;
    }

    .config-group h4 {
      font-size: 13px;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 16px;
      padding-left: 8px;
      border-left: 3px solid #3498db;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 500;
      color: #555;
    }

    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group input[type="color"],
    .form-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #3498db;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-hint {
      font-size: 11px;
      color: #7f8c8d;
      margin-top: 3px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #3498db;
    }

    .checkbox-group label {
      margin-bottom: 0;
      cursor: pointer;
    }

    .color-preview {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid #ddd;
      vertical-align: middle;
      margin-left: 6px;
    }

    /* 生成按钮 */
    .action-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #ecf0f1;
    }

    .btn {
      padding: 12px 32px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #3498db;
      color: white;
    }

    .btn-primary:hover {
      background: #2980b9;
    }

    .btn-primary:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #ecf0f1;
      color: #2c3e50;
    }

    .btn-secondary:hover {
      background: #d5dbdb;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid #ecf0f1;
      border-top-color: #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .message {
      padding: 10px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 13px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    .log-output {
      background: #2c3e50;
      color: #ecf0f1;
      padding: 12px;
      border-radius: 6px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 11px;
      line-height: 1.5;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: 16px;
      display: none;
    }

    .preset-locations {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .preset-btn {
      padding: 4px 10px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 12px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .preset-btn:hover {
      background: #3498db;
      color: white;
      border-color: #3498db;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 顶部预览和历史 -->
    <div class="top-section">
      <div class="panel">
        <h3>预览</h3>
        <div class="preview-area" id="previewArea">
          <div class="preview-container" id="previewContainer">
            <div class="preview-wrapper" id="previewWrapper">
              <div class="preview-placeholder" id="previewPlaceholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
                <p>点击"生成地图"开始创建</p>
              </div>
            </div>
          </div>
          <div class="preview-controls" id="previewControls" style="display: none;">
            <button onclick="zoomOut()" title="缩小">−</button>
            <span class="zoom-level" id="zoomLevel">100%</span>
            <button onclick="zoomIn()" title="放大">+</button>
            <button onclick="resetZoom()" title="重置">⌂</button>
            <button onclick="togglePreviewTheme()" title="切换背景">◐</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <h3>历史记录</h3>
        <div class="gallery" id="gallery"></div>
      </div>
    </div>

    <!-- 底部配置区域 -->
    <div class="config-section">
      <div class="message" id="messageBox"></div>

      <div class="config-grid">
        <!-- 位置信息 -->
        <div class="config-group">
          <h4>位置信息</h4>
          <div class="preset-locations">
            <button class="preset-btn" onclick="setPreset('beijing')">北京</button>
            <button class="preset-btn" onclick="setPreset('shanghai')">上海</button>
            <button class="preset-btn" onclick="setPreset('guangzhou')">广州</button>
            <button class="preset-btn" onclick="setPreset('shenzhen')">深圳</button>
            <button class="preset-btn" onclick="setPreset('hangzhou')">杭州</button>
            <button class="preset-btn" onclick="setPreset('chengdu')">成都</button>
          </div>
          <div class="form-group">
            <label>位置名称</label>
            <input type="text" id="locationName" placeholder="例如：我的家">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>经度</label>
              <input type="number" id="lon" step="0.000001" placeholder="116.407378">
            </div>
            <div class="form-group">
              <label>纬度</label>
              <input type="number" id="lat" step="0.000001" placeholder="40.047033">
            </div>
          </div>
        </div>

        <!-- 地图参数 -->
        <div class="config-group">
          <h4>地图参数</h4>
          <div class="form-group">
            <label>缩放级别 (1-20)</label>
            <input type="number" id="zoom" min="1" max="20" step="0.5" value="17">
            <div class="form-hint">建议：16-18 适合街道视图</div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>宽度 (px)</label>
              <input type="number" id="width" value="1600" step="100">
            </div>
            <div class="form-group">
              <label>高度 (px)</label>
              <input type="number" id="height" value="1600" step="100">
            </div>
          </div>
          <div class="form-group">
            <label>输出文件名</label>
            <input type="text" id="filename" value="street-map.png">
          </div>
        </div>

        <!-- 主题设置 -->
        <div class="config-group">
          <h4>主题设置</h4>
          <div class="form-group">
            <label>主题色 <span class="color-preview" id="colorPreview"></span></label>
            <input type="color" id="themeColor" value="#ffffff">
            <div class="form-hint">所有元素（道路、水域、绿地、建筑物等）的基础颜色</div>
          </div>
        </div>

        <!-- 边框设置 -->
        <div class="config-group">
          <h4>边框设置</h4>
          <div class="form-group">
            <label>边框类型</label>
            <select id="borderType">
              <option value="none">无边框</option>
              <option value="single" selected>单边框</option>
              <option value="double">双层边框</option>
            </select>
          </div>
          <div class="form-row" id="borderWidthRow">
            <div class="form-group">
              <label>边框宽度 (px)</label>
              <input type="number" id="borderWidth" value="4" min="1" max="20">
            </div>
          </div>
          <div class="form-row" id="doubleBorderRow" style="display: none;">
            <div class="form-group">
              <label>外层宽度 (px)</label>
              <input type="number" id="outerWidth" value="4" min="1" max="20">
            </div>
            <div class="form-group">
              <label>间距 (px)</label>
              <input type="number" id="borderGap" value="20" min="1" max="50">
            </div>
            <div class="form-group">
              <label>内层宽度 (px)</label>
              <input type="number" id="innerWidth" value="1" min="1" max="10">
            </div>
          </div>
        </div>

        <!-- 河流设置 -->
        <div class="config-group">
          <h4>河流设置</h4>
          <div class="checkbox-group">
            <input type="checkbox" id="showWater" checked>
            <label for="showWater">显示河流/水域</label>
          </div>
          <div class="form-group">
            <label>河流透明度 (%)</label>
            <input type="number" id="waterOpacity" value="40" min="0" max="100">
            <div class="form-hint">0=完全透明，100=不透明</div>
          </div>
        </div>

        <!-- 绿地设置 -->
        <div class="config-group">
          <h4>绿地设置</h4>
          <div class="checkbox-group">
            <input type="checkbox" id="showGreen" checked>
            <label for="showGreen">显示绿地/公园</label>
          </div>
          <div class="form-group">
            <label>绿地透明度 (%)</label>
            <input type="number" id="greenOpacity" value="80" min="0" max="100">
            <div class="form-hint">0=完全透明，100=不透明</div>
          </div>
        </div>

        <!-- 建筑物设置 -->
        <div class="config-group">
          <h4>建筑物设置</h4>
          <div class="checkbox-group">
            <input type="checkbox" id="showBuilding" checked>
            <label for="showBuilding">显示建筑物</label>
          </div>
          <div class="form-group">
            <label>建筑物透明度 (%)</label>
            <input type="number" id="buildingOpacity" value="60" min="0" max="100">
            <div class="form-hint">0=完全透明，100=不透明</div>
          </div>
          <div class="form-group">
            <label>绘制范围 (%)</label>
            <input type="number" id="buildingRange" value="80" min="0" max="100">
            <div class="form-hint">从图片中心开始的绘制范围，0-100%</div>
          </div>
        </div>

        <!-- 边缘过渡 -->
        <div class="config-group">
          <h4>边缘过渡</h4>
          <div class="form-group">
            <label>过渡类型</label>
            <select id="fadeType">
              <option value="none">无</option>
              <option value="gradient" selected>渐隐</option>
            </select>
          </div>
          <div class="form-group" id="fadeRatioRow">
            <label>过渡比例 (%)</label>
            <input type="number" id="fadeRatio" value="15" min="1" max="50">
            <div class="form-hint">边缘过渡宽度占图片尺寸的百分比</div>
          </div>
        </div>
      </div>

      <div class="action-bar">
        <button class="btn btn-secondary" onclick="resetConfig()">重置</button>
        <button class="btn btn-primary" id="generateBtn" onclick="generateMap()">生成地图</button>
      </div>

      <div class="log-output" id="logOutput"></div>
    </div>
  </div>

  <!-- 模块化 JavaScript -->
  <script src="js/config.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/mapGenerator.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
